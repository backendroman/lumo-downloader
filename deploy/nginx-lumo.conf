# /etc/nginx/sites-available/lumo, https via certbot

limit_req_zone $binary_remote_addr zone=lumo_api:10m rate=10r/s;

upstream lumo_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 64k;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /static/ {
        alias /opt/lumo/app/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # SSE
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://lumo_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    location ~ ^/api/jobs/[^/]+/file$ {
        proxy_pass http://lumo_app;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_max_temp_file_size 0;
    }

    location /api/ {
        limit_req zone=lumo_api burst=30 nodelay;
        proxy_pass http://lumo_app;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://lumo_app;
    }
}
